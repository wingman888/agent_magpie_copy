name: rsi-bench-go
on: { push: { branches: ["bench/**"] } }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: go test
        run: |
          set +e
          pkgs=$(cat .bench/packages)
          # 默认带 nogui：桌面界面要 cgo 与 GTK 等系统库，Actions 上编译不了，与 magpie 的 CLI 构建一致
          tags="nogui"; [ -f .bench/tags ] && tags=$(cat .bench/tags)
          go vet -tags "$tags" $pkgs > vet.log 2>&1
          run=""; [ -f .bench/run ] && run="-run=$(cat .bench/run)"
          go test -tags "$tags" -count=1 -json $run $pkgs > test.json 2> build.log
          code=$?
          pass=$(grep -c '"Action":"pass","Package":"[^"]*","Test"' test.json)
          fail=$(grep -c '"Action":"fail","Package":"[^"]*","Test"' test.json)
          buildfail=$(grep -c '"Action":"fail","Package":"[^"]*","Elapsed"' test.json)
          echo "::notice title=summary::pass=$pass fail=$fail pkgfail=$buildfail exit=$code"
          # 通过的顶层测试名单：编译失败的包里的测试既不算 pass 也不算 fail，只有名单能区分“没通过”
          passed=$(grep -o '"Action":"pass","Package":"[^"]*","Test":"[^"/]*"' test.json | sed 's/.*"Test":"//; s/"$//' | sort -u | tr '\n' ' ')
          echo "::notice title=passed::${passed:- }"
          grep -o '"Action":"fail","Package":"[^"]*","Test":"[^"]*"' test.json | head -n 25 | sed 's/^/::error title=failed-test::/'
          grep -h -E '_test.go:[0-9]+:|\.go:[0-9]+:[0-9]+:' build.log vet.log | head -n 25 | sed 's/^/::error title=compile::/'
          # 不带文件行号的构建错误（cgo、embed、模块解析等）也要能看到
          grep -h -E '"Action":"build-fail"|"Output":"# |cannot find|no matching files|build constraints|pkg-config|package .* is not in' test.json build.log | head -n 10 | cut -c1-300 | sed 's/^/::error title=compile::/'
          grep -o '"Output":"[^"]*_test.go:[0-9]*: [^"]*"' test.json | head -n 25 | sed 's/^/::error title=assert::/'
          exit $code
