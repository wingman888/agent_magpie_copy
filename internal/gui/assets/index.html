<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dial</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top" style="--wails-draggable:drag">
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 44 44" width="15" height="15"><path d="M22 4.5a17.5 17.5 0 1 1-9.4 32.3M22 4.5A17.5 17.5 0 0 0 12.6 36.8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><path d="M22 22l5.7-5.7" stroke="currentColor" stroke-width="4.4" stroke-linecap="round"/><circle cx="22" cy="22" r="3.4" fill="currentColor"/></svg></span>
    <span>dial</span>
  </div>
  <nav class="seg" id="nav" style="--wails-draggable:no-drag">
    <button data-view="agents" class="on">Agents</button>
    <button data-view="providers">Providers</button>
  </nav>
  <div class="actions" style="--wails-draggable:no-drag">
    <button class="icon" id="sync" title="Refresh model lists (models.dev and every vendor)">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="icon" id="open" title="Open as a window">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M6 3H3.5A1.5 1.5 0 0 0 2 4.5v8A1.5 1.5 0 0 0 3.5 14h8a1.5 1.5 0 0 0 1.5-1.5V10M9 2h5v5M14 2 8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>

<main class="view" id="view-agents">
  <div class="list" id="agents"></div>
  <section class="profiles">
    <div class="row-head">
      <span class="label">Profiles</span>
      <span class="grow"></span>
      <button class="text" id="save">＋ Save current</button>
    </div>
    <div id="profiles" class="chips"></div>
  </section>
</main>

<main class="view" id="view-providers" hidden>
  <div class="gw" id="gateway"></div>
  <div class="activity" id="activity" hidden></div>
  <div class="list" id="providers"></div>
  <div class="after-list">
    <button class="text" id="addProvider">＋ Add provider</button>
  </div>
  <section class="sheet" id="addSheet" hidden></section>
</main>

<footer class="foot">
  <span id="status" class="status"></span>
  <span class="grow"></span>
  <button class="text" id="openMain">Open dial</button>
  <button class="text" id="quit">Quit</button>
</footer>

<div id="pop" class="pop" hidden>
  <div class="search">
    <svg viewBox="0 0 16 16" width="13" height="13"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="q" type="text" spellcheck="false" autocomplete="off" placeholder="Filter…">
  </div>
  <ul id="list"></ul>
</div>

<script src="app.js"></script>
</body>
</html>
